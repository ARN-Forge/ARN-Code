[package]
name = "arn-ide"
version = "0.5.0"
description = "ARN IDE - Lightweight desktop IDE for coding"
authors = ["ARN contributors"]
license = "MIT"
repository = ""
default-run = "arn-ide"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
once_cell = "1.19"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "arn-ide"
path = "src/main.rs"
