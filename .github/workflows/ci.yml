name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Windows build
    # The terminal UI currently uses the Windows Console API, so checking it
    # on Linux/macOS would fail before it reaches the actual project code.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel
