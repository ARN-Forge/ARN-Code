name: CI

on:
  push:
  pull_request:

# Builds and tests only; nothing in this workflow writes to the repository.
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }} build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          # Same fixed image as the release build (see release.yml).
          - name: Linux x64
            os: ubuntu-24.04
          - name: macOS arm64
            os: macos-latest
          - name: macOS x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: C:\vcpkg\vcpkg.exe install openssl:x64-windows

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev ninja-build

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install openssl@3 ninja

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="C:\vcpkg\scripts\buildsystems\vcpkg.cmake"

      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Configure macOS
        if: runner.os == 'macOS'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"

      - name: Build
        run: cmake --build build --config Release --parallel

      # Which shells the tests below really use: CTest runs the installer tests
      # with the bash and PowerShell that CMake found, and install.sh runs as sh.
      - name: Show shell and PowerShell versions
        shell: bash
        run: |
          echo "bash on PATH: $(command -v bash) - $(bash --version | head -n 1)"
          if [ -x /bin/bash ]; then echo "/bin/bash: $(/bin/bash --version | head -n 1)"; fi
          ls -l /bin/sh /var/select/sh 2>/dev/null || true
          echo "sh reports BASH_VERSION='$(sh -c 'echo "${BASH_VERSION:-}"')'"
          echo "sha256sum: $(command -v sha256sum || echo none), shasum: $(command -v shasum || echo none)"
          if [ "$RUNNER_OS" = Windows ]; then
            echo "pwsh: $(pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()')"
            echo "Windows PowerShell: $(powershell -NoProfile -Command '$PSVersionTable.PSVersion.ToString()')"
          fi
          grep -E '^ARN_(BASH|POWERSHELL)_EXECUTABLE' build/CMakeCache.txt || true

      # The Windows installer tests must run under PowerShell 7, not fall back
      # to Windows PowerShell 5.1; every script must also parse in PowerShell 7.
      - name: Check PowerShell 7 coverage
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion.Major -lt 7) { throw "pwsh is $($PSVersionTable.PSVersion), not PowerShell 7." }
          $chosen = (Select-String -Path build/CMakeCache.txt -Pattern '^ARN_POWERSHELL_EXECUTABLE:[A-Z]+=(.*)$').Matches[0].Groups[1].Value
          if ([IO.Path]::GetFileName($chosen) -ne 'pwsh.exe') { throw "CTest would run the PowerShell tests with '$chosen', not pwsh.exe." }
          $failed = 0
          foreach ($file in @(Get-ChildItem scripts, tests -Filter *.ps1)) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors)
            foreach ($e in @($errors)) { Write-Host "::error file=$($file.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $failed++ }
          }
          if ($failed) { throw "$failed PowerShell 7 parse error(s)." }
          Write-Host "PowerShell $($PSVersionTable.PSVersion) parses every script; CTest uses $chosen."

      - name: Model list regression tests
        run: ctest --test-dir build -C Release --output-on-failure

      # The executable must start and name the commit it was built from.
      - name: Smoke test executable and build identity
        shell: bash
        run: |
          if [ -x build/Release/arn.exe ]; then arn=build/Release/arn.exe; else arn=build/arn; fi
          actual="$("$arn" --version | tr -d '\r')"
          echo "$actual"
          if [[ ! "$actual" =~ ^arn\ [0-9]+\.[0-9]+\.[0-9]+\ \(${GITHUB_SHA:0:12}\)$ ]]; then
            echo "::error::'$actual' does not name commit ${GITHUB_SHA:0:12}."
            exit 1
          fi

      # The same minimum-OS limits as the release build (see release.yml).
      - name: Check minimum OS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            bash scripts/check-min-os.sh macos build/arn 15.0
          else
            bash scripts/check-min-os.sh linux build/arn 2.39 3.4.32 1.3.15
          fi

      # The same packaging and verification the release workflow uses, on
      # every push, without publishing anything: the archive holds exactly
      # arn, LICENSE, README.md and THIRD-PARTY-NOTICES.txt, and the extracted arn, run with a minimal
      # environment, reports the CMake version and this commit. On macOS the
      # script runs with the system /bin/bash (3.2).
      - name: Package and verify Unix archive (not published)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then script_bash=/bin/bash; else script_bash=bash; fi
          version="$(tr -d '\r' < CMakeLists.txt | sed -n 's/^project([A-Za-z]* VERSION \([0-9][0-9.]*\) .*/\1/p')"
          echo "CMake version: $version; packaging with $("$script_bash" --version | head -n 1)"
          "$script_bash" scripts/package-unix.sh package --binary build/arn --name arn-ci \
            --archive arn-ci.tar.gz --version "$version" --commit "$GITHUB_SHA"
          "$script_bash" scripts/package-unix.sh verify --archive arn-ci.tar.gz --name arn-ci \
            --version "$version" --commit "$GITHUB_SHA"
          tar -tzvf arn-ci.tar.gz
          rm -f arn-ci.tar.gz

      # macOS ships Bash 3.2 as /bin/bash (and as /bin/sh). CTest may pick a
      # newer bash from Homebrew, so the shell scripts and their tests also run
      # here with /bin/bash itself; install.sh runs as sh in these tests.
      # The runner starts this step with SIGPIPE ignored, and a shell cannot
      # trap a signal that was ignored on entry (POSIX), so the installer's
      # SIGPIPE rollback could not be exercised. The tests therefore run with
      # SIGPIPE restored to its default, as CTest runs them.
      - name: Unix scripts and installer tests with Bash 3.2
        if: runner.os == 'macOS'
        shell: bash
        run: |
          major_minor="$(/bin/bash -c 'echo "${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]}"')"
          /bin/bash --version | head -n 1
          if [ "$major_minor" != 3.2 ]; then echo "::error::/bin/bash is $major_minor, not 3.2."; exit 1; fi
          if [ ! -x /usr/bin/perl ]; then echo "::error::/usr/bin/perl is missing."; exit 1; fi
          /usr/bin/perl -e 'printf "perl %vd; SIGPIPE in this step: %s\n", $^V, $SIG{PIPE} || "DEFAULT"'
          default_sigpipe() { /usr/bin/perl -e '$SIG{PIPE}="DEFAULT"; exec @ARGV or die "exec $ARGV[0]: $!\n"' "$@"; }
          default_sigpipe /bin/bash -c '/usr/bin/perl -e '\''print "SIGPIPE for the tests: ", ($SIG{PIPE} || "DEFAULT"), "\n"'\'''
          for script in scripts/install.sh scripts/package-unix.sh scripts/check-min-os.sh tests/install_unix_test.sh \
                        tests/install_unix_upgrade_test.sh tests/install_unix_recovery_test.sh tests/package_unix_test.sh; do
            /bin/bash -n "$script"
          done
          /bin/sh -n scripts/install.sh
          default_sigpipe /bin/bash tests/package_unix_test.sh scripts/package-unix.sh "$(command -v python3)"
          for test in install_unix_test install_unix_upgrade_test install_unix_recovery_test; do
            echo "::group::$test with /bin/bash"
            default_sigpipe /bin/bash "tests/$test.sh" scripts/install.sh
            echo "::endgroup::"
          done

  # The Windows IDE built as the release builds it, without publishing or
  # uploading anything: the installer payload and the portable ZIP are
  # verified for this commit, and the production bundle and the running IDE
  # are checked for CDN code, the Content Security Policy and the IPC surface.
  ide-windows:
    name: Windows IDE build (not published)
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ide/package-lock.json
      # Same pinned action and toolchain as release.yml.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.1
      - name: Install OpenSSL
        shell: pwsh
        run: C:\vcpkg\vcpkg.exe install openssl:x64-windows
      - name: Build the C++ backend
        shell: pwsh
        run: |
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="C:\vcpkg\scripts\buildsystems\vcpkg.cmake"
          cmake --build build --config Release --target arn arn_server_fixture --parallel
      - name: Install frontend dependencies
        working-directory: ide
        run: npm ci
      - name: Test Rust bridge
        shell: pwsh
        run: |
          $env:ARN_TEST_BIN = (Resolve-Path build/Release/arn_server_fixture.exe).Path
          cargo test --locked --manifest-path ide/src-tauri/Cargo.toml
      - name: Build branded Windows installer
        working-directory: ide
        shell: pwsh
        run: |
          $env:ARN_BIN = (Resolve-Path ../build/Release/arn.exe).Path
          $env:ARN_RUNTIME_DIR = 'C:\vcpkg\installed\x64-windows\bin'
          npm run installer:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify the installer payload and the portable ZIP (not published)
        shell: pwsh
        run: |
          $version = (Get-Content ide/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $setup = @(Get-ChildItem 'ide/src-tauri/target/release/bundle/nsis' -Filter '*-setup.exe')
          if ($setup.Count -ne 1) { throw 'Expected exactly one Windows installer' }
          7z x $setup[0].FullName '-oide/src-tauri/target/installer-smoke' -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:ARN_EXPECTED_VERSION = $version
          $env:ARN_EXPECTED_COMMIT = $env:GITHUB_SHA
          node tests/installer_runtime_test.mjs ide/src-tauri/target/installer-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/verify-ide-package.ps1 -Directory ide/src-tauri/target/installer-smoke `
            -ExpectedVersion $version -ExpectedCommit $env:GITHUB_SHA
          $package = "arn-ide-windows-x64"
          New-Item -ItemType Directory -Force $package | Out-Null
          Copy-Item "ide/src-tauri/target/release/arn-ide.exe" "$package/arn-ide.exe"
          $runtime = 'ide/src-tauri/installer/runtime'
          foreach ($file in (Get-Content "$runtime/manifest.json" -Raw | ConvertFrom-Json)) {
            Copy-Item (Join-Path $runtime $file) $package
          }
          Copy-Item "LICENSE", "README.md" $package
          Copy-Item "docs/ide-arn-bridge.md" "$package/IDE-README.md"
          Compress-Archive -Path "$package/*" -DestinationPath "arn-ide-windows-x64.zip"
          ./scripts/verify-ide-package.ps1 -ZipPath arn-ide-windows-x64.zip `
            -ExpectedVersion $version -ExpectedCommit $env:GITHUB_SHA
      - name: Check the production bundle and the running IDE
        shell: pwsh
        run: |
          $env:ARN_IDE_DIST = 'ide/dist'
          node --test tests/ide_security_test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/ide_runtime_test.mjs ide/src-tauri/target/release/arn-ide.exe com.arnecto.ide
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # One Debug build with AddressSanitizer and UndefinedBehaviorSanitizer runs
  # every test, including the POSIX terminal UI on a real pseudo-terminal
  # (tests/posix_pty_test.sh, through tmux). Any sanitizer report stops the
  # test that triggered it, so it fails.
  linux-sanitizers:
    name: Linux x64 Debug ASan/UBSan + PTY
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev ninja-build tmux

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DARN_ENABLE_PTY_TESTS=ON
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build --parallel

      - name: Tests, including the PTY suite
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure
