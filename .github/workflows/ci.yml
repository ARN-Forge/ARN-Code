name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }} build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          - name: Linux x64
            os: ubuntu-latest
          - name: macOS arm64
            os: macos-latest
          - name: macOS x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: C:\vcpkg\vcpkg.exe install openssl:x64-windows

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev ninja-build

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install openssl@3 ninja

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="C:\vcpkg\scripts\buildsystems\vcpkg.cmake"

      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Configure macOS
        if: runner.os == 'macOS'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Model list regression tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Smoke test Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\build\Release\arn.exe --version

      - name: Smoke test Unix executable
        if: runner.os != 'Windows'
        run: ./build/arn --version

  # One Debug build with AddressSanitizer and UndefinedBehaviorSanitizer runs
  # every test, including the POSIX terminal UI on a real pseudo-terminal
  # (tests/posix_pty_test.sh, through tmux). Any sanitizer report stops the
  # test that triggered it, so it fails.
  linux-sanitizers:
    name: Linux x64 Debug ASan/UBSan + PTY
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev ninja-build tmux

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DARN_ENABLE_PTY_TESTS=ON
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build --parallel

      - name: Tests, including the PTY suite
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure
