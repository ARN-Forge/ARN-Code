name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default: the build jobs run third-party build tools (npm, cargo,
# vcpkg, Homebrew) and must not hold a token that can write. Only the release
# job, which creates the GitHub release, gets contents: write.
#
# Third-party actions are pinned to full commit SHAs of the official
# repositories (the comment names the release the SHA belongs to), and the
# Rust toolchain to an exact version. Update them in a dedicated pull request:
# resolve the new release tag to its commit with
#   git ls-remote https://github.com/<owner>/<action>.git refs/tags/<tag> refs/tags/<tag>^{}
# (use the ^{} line for annotated tags), check the release notes, and let CI
# and a release dry run on a fork pass before merging.
permissions:
  contents: read

# One release run per tag at a time: a manual run on a tag while the push run
# for it is still going would otherwise publish the same release twice.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Runs before any build. Fails unless this run is for a vX.Y.Z tag that
  # matches the CLI and IDE versions and has release notes, so a manual run on
  # a branch such as main can never publish a release named after the branch.
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check tag, versions and release notes
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: cmake "-DREF_TYPE=$REF_TYPE" "-DREF_NAME=$REF_NAME" -P scripts/release-preflight.cmake

  build:
    name: Package ${{ matrix.name }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: arn-windows-x64
            archive: arn-windows-x64.zip
          # A fixed image, not ubuntu-latest: the build's glibc and libstdc++
          # set the oldest distribution the binary runs on (checked below).
          - name: Linux x64
            os: ubuntu-24.04
            artifact: arn-linux-x64
            archive: arn-linux-x64.tar.gz
          - name: macOS arm64
            os: macos-latest
            artifact: arn-macos-arm64
            archive: arn-macos-arm64.tar.gz
          - name: macOS x64
            os: macos-15-intel
            artifact: arn-macos-x64
            archive: arn-macos-x64.tar.gz
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: C:\vcpkg\vcpkg.exe install openssl:x64-windows

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev ninja-build

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install openssl@3 ninja

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="C:\vcpkg\scripts\buildsystems\vcpkg.cmake"

      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      # macOS 15 is the oldest release Homebrew supports in Tier 1 on Apple
      # Silicon, and users need Homebrew's openssl@3; without a deployment
      # target the binary would need the runner's own macOS version.
      - name: Configure macOS
        if: runner.os == 'macOS'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"

      - name: Build
        run: cmake --build build --config Release --parallel

      # The release binary must name exactly the tagged version and commit.
      - name: Check build identity
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -x build/Release/arn.exe ]; then arn=build/Release/arn.exe; else arn=build/arn; fi
          expected="arn ${REF_NAME#v} (${GITHUB_SHA:0:12})"
          actual="$("$arn" --version | tr -d '\r')"
          echo "$actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Expected '$expected', got '$actual'."
            exit 1
          fi

      # The oldest OS the binary runs on: macOS 15 (LC_BUILD_VERSION minos);
      # on Linux, Ubuntu 24.04's glibc 2.39 and the GLIBCXX/CXXABI versions a
      # build from this runner was shown to run with there.
      - name: Check minimum OS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            bash scripts/check-min-os.sh macos build/arn 15.0
          else
            bash scripts/check-min-os.sh linux build/arn 2.39 3.4.32 1.3.15
          fi

      # The same build tree and configuration that is packaged below.
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # Checks the ZIP's entries and DLL dependencies, then runs the arn.exe
      # extracted from it with only System32 on PATH; the version and commit
      # must match the tag. A package that fails is deleted.
      - name: Package and verify Windows ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          ./scripts/package-windows.ps1 `
            -BuildDir build/Release `
            -OutputDir arn-windows-x64 `
            -ArchivePath arn-windows-x64.zip `
            -ExpectedVersion ($env:REF_NAME.Substring(1)) `
            -ExpectedCommit $env:GITHUB_SHA

      # Archives exactly arn, LICENSE and README.md, checks the entries, runs
      # the extracted arn with a minimal environment against the tag's version
      # and commit, and lists its shared libraries. A package that fails is deleted.
      - name: Package and verify Unix archive
        if: runner.os != 'Windows'
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: >-
          bash scripts/package-unix.sh package
          --binary build/arn
          --name "${{ matrix.artifact }}"
          --archive "${{ matrix.archive }}"
          --version "${REF_NAME#v}"
          --commit "$GITHUB_SHA"

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  ide-windows:
    name: Package Windows IDE
    needs: preflight
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ide/package-lock.json
      # stable branch of dtolnay/rust-toolchain at the time of pinning; with a
      # SHA the toolchain must be named, so it is an exact, tested version.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.1
      - name: Install OpenSSL
        shell: pwsh
        run: C:\vcpkg\vcpkg.exe install openssl:x64-windows
      - name: Build C++ backend and tests
        shell: pwsh
        run: |
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="C:\vcpkg\scripts\buildsystems\vcpkg.cmake"
          cmake --build build --config Release --parallel
          ctest --test-dir build -C Release --output-on-failure
      - name: Install frontend dependencies
        working-directory: ide
        run: npm ci
      - name: Test Rust bridge
        shell: pwsh
        run: |
          $env:ARN_TEST_BIN = (Resolve-Path build/Release/arn_server_fixture.exe).Path
          cargo test --locked --manifest-path ide/src-tauri/Cargo.toml
      - name: Build branded Windows installer
        working-directory: ide
        shell: pwsh
        run: |
          $env:ARN_BIN = (Resolve-Path ../build/Release/arn.exe).Path
          $env:ARN_RUNTIME_DIR = 'C:\vcpkg\installed\x64-windows\bin'
          npm run installer:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The installer payload: exact tag version and commit of the bundled
      # arn.exe (no -dirty or unknown), the IDE's version resource, runtime
      # DLLs and third-party notices.
      - name: Test the actual installer payload
        working-directory: ide
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $setup = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*-setup.exe')
          if ($setup.Count -ne 1) { throw 'Expected exactly one Windows installer' }
          7z x $setup[0].FullName '-osrc-tauri/target/installer-smoke' -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:ARN_EXPECTED_VERSION = $env:REF_NAME.Substring(1)
          $env:ARN_EXPECTED_COMMIT = $env:GITHUB_SHA
          node ../tests/installer_runtime_test.mjs src-tauri/target/installer-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ../scripts/verify-ide-package.ps1 -Directory src-tauri/target/installer-smoke `
            -ExpectedVersion $env:ARN_EXPECTED_VERSION -ExpectedCommit $env:GITHUB_SHA
          # The production bundle: Monaco bundled, no CDN code, restrictive CSP.
          $env:ARN_IDE_DIST = 'dist'
          node --test ../tests/ide_security_test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package portable IDE
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $package = "arn-ide-windows-x64"
          New-Item -ItemType Directory -Force $package | Out-Null
          Copy-Item "ide/src-tauri/target/release/arn-ide.exe" "$package/arn-ide.exe"
          $runtime = 'ide/src-tauri/installer/runtime'
          foreach ($file in (Get-Content "$runtime/manifest.json" -Raw | ConvertFrom-Json)) {
            Copy-Item (Join-Path $runtime $file) $package
          }
          Copy-Item "LICENSE", "README.md" $package
          Copy-Item "docs/ide-arn-bridge.md" "$package/IDE-README.md"
          Compress-Archive -Path "$package/*" -DestinationPath "arn-ide-windows-x64.zip"
          ./scripts/verify-ide-package.ps1 -ZipPath arn-ide-windows-x64.zip `
            -ExpectedVersion ($env:REF_NAME.Substring(1)) -ExpectedCommit $env:GITHUB_SHA
          $installers = @(Get-ChildItem 'ide/src-tauri/target/release/bundle/nsis' -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer' }
          Copy-Item $installers[0].FullName 'arn-ide-windows-x64-setup.exe'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-arn-ide-windows-x64
          path: |
            arn-ide-windows-x64.zip
            arn-ide-windows-x64-setup.exe
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [preflight, build, ide-windows]
    # Defence in depth: preflight already refuses non-tag runs.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # The only job that writes: it creates the release and uploads its assets.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # One directory per artifact, so two artifacts with the same file name
      # cannot silently overwrite each other; release-checksums.cmake rejects it.
      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: artifacts

      # Exactly these assets are published, each listed once in SHA256SUMS.
      - name: Collect assets and write SHA256SUMS
        run: >-
          cmake -DARTIFACTS_DIR=artifacts -DDIST_DIR=dist
          "-DEXPECTED=arn-windows-x64.zip;arn-linux-x64.tar.gz;arn-macos-arm64.tar.gz;arn-macos-x64.tar.gz;arn-ide-windows-x64.zip;arn-ide-windows-x64-setup.exe"
          -P scripts/release-checksums.cmake

      # An independent implementation must agree with every manifest line.
      - name: Check SHA256SUMS with sha256sum
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          generate_release_notes: true
          files: dist/*
