name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Package ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: arn-windows-x64
            archive: arn-windows-x64.zip
          - name: Linux x64
            os: ubuntu-latest
            artifact: arn-linux-x64
            archive: arn-linux-x64.tar.gz
          - name: macOS arm64
            os: macos-latest
            artifact: arn-macos-arm64
            archive: arn-macos-arm64.tar.gz
          - name: macOS x64
            os: macos-15-intel
            artifact: arn-macos-x64
            archive: arn-macos-x64.tar.gz
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: C:\vcpkg\vcpkg.exe install openssl:x64-windows

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev ninja-build

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install openssl@3 ninja

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="C:\vcpkg\scripts\buildsystems\vcpkg.cmake"

      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Configure macOS
        if: runner.os == 'macOS'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = "arn-windows-x64"
          New-Item -ItemType Directory -Force $package | Out-Null
          Copy-Item "build\Release\arn.exe" "$package\arn.exe"
          Copy-Item "C:\vcpkg\installed\x64-windows\bin\libssl-3-x64.dll" $package
          Copy-Item "C:\vcpkg\installed\x64-windows\bin\libcrypto-3-x64.dll" $package
          Copy-Item "LICENSE", "README.md" $package
          Compress-Archive -Path "$package\*" -DestinationPath "arn-windows-x64.zip" -Force

      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir "${{ matrix.artifact }}"
          cp build/arn LICENSE README.md "${{ matrix.artifact }}/"
          tar -czf "${{ matrix.archive }}" "${{ matrix.artifact }}"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
