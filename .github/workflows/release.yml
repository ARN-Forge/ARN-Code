name: Release

# Two steps, never one:
#   1. Pushing a vX.Y.Z tag builds the packages that release/platforms.json
#      (the release platform policy in the tagged commit) names, and creates a
#      DRAFT release with exactly those assets and their SHA256SUMS. Nothing is
#      public yet.
#   2. Publishing is a separate, manual run: "Run workflow" on the same tag
#      with "publish_draft" checked. It checks the draft again (assets,
#      checksums, prerelease flag) and only then publishes it, as a prerelease
#      and not the latest release when the policy says so.
# A release or draft that already exists for the tag is never replaced or
# added to: step 1 stops, and the draft has to be removed by hand to retry.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_draft:
        description: "Publish the checked draft release of this tag (run on the tag)"
        type: boolean
        default: false

# Read-only by default: the build jobs run third-party build tools (npm, cargo,
# vcpkg, Homebrew) and must not hold a token that can write. Only the draft
# and publish jobs, which write the GitHub release, get contents: write.
#
# Third-party actions are pinned to full commit SHAs of the official
# repositories (the comment names the release the SHA belongs to), and the
# Rust toolchain to an exact version. Update them in a dedicated pull request:
# resolve the new release tag to its commit with
#   git ls-remote https://github.com/<owner>/<action>.git refs/tags/<tag> refs/tags/<tag>^{}
# (use the ^{} line for annotated tags), check the release notes, and let CI
# and a release dry run on a fork pass before merging.
permissions:
  contents: read

# One release run per tag at a time: a manual run on a tag while the push run
# for it is still going would otherwise work on the same release twice.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Runs before anything else. Fails unless this run is for a vX.Y.Z tag that
  # matches the CLI and IDE versions, has release notes and a valid platform
  # policy for this version, so a manual run on a branch such as main can never
  # publish a release named after the branch. Its outputs are the policy: what
  # to build, the exact assets, and how the release is marked.
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build_matrix: ${{ steps.policy.outputs.build_matrix }}
      windows_ide: ${{ steps.policy.outputs.windows_ide }}
      expected: ${{ steps.policy.outputs.expected }}
      prerelease: ${{ steps.policy.outputs.prerelease }}
      make_latest: ${{ steps.policy.outputs.make_latest }}
      platforms: ${{ steps.policy.outputs.platforms }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check tag, versions, release notes and platform policy
        id: policy
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: >-
          cmake "-DREF_TYPE=$REF_TYPE" "-DREF_NAME=$REF_NAME" "-DOUTPUT_FILE=$GITHUB_OUTPUT"
          -P scripts/release-preflight.cmake

  # The CLI packages the policy names, and only those: the matrix is the
  # policy's, not a fixed list.
  build:
    name: Package ${{ matrix.name }}
    needs: preflight
    if: ${{ !inputs.publish_draft }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.build_matrix) }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: C:\vcpkg\vcpkg.exe install openssl:x64-windows

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev ninja-build

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install openssl@3 ninja

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="C:\vcpkg\scripts\buildsystems\vcpkg.cmake"

      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      # macOS 15 is the oldest release Homebrew supports in Tier 1 on Apple
      # Silicon, and users need Homebrew's openssl@3; without a deployment
      # target the binary would need the runner's own macOS version.
      - name: Configure macOS
        if: runner.os == 'macOS'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"

      - name: Build
        run: cmake --build build --config Release --parallel

      # The release binary must name exactly the tagged version and commit.
      - name: Check build identity
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -x build/Release/arn.exe ]; then arn=build/Release/arn.exe; else arn=build/arn; fi
          expected="arn ${REF_NAME#v} (${GITHUB_SHA:0:12})"
          actual="$("$arn" --version | tr -d '\r')"
          echo "$actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Expected '$expected', got '$actual'."
            exit 1
          fi

      # The oldest OS the binary runs on: macOS 15 (LC_BUILD_VERSION minos);
      # on Linux, Ubuntu 24.04's glibc 2.39 and the GLIBCXX/CXXABI versions a
      # build from this runner was shown to run with there.
      - name: Check minimum OS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            bash scripts/check-min-os.sh macos build/arn 15.0
          else
            bash scripts/check-min-os.sh linux build/arn 2.39 3.4.32 1.3.15
          fi

      # The same build tree and configuration that is packaged below.
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # Checks the ZIP's entries and DLL dependencies, then runs the arn.exe
      # extracted from it with only System32 on PATH; the version and commit
      # must match the tag. A package that fails is deleted.
      - name: Package and verify Windows ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          ./scripts/package-windows.ps1 `
            -BuildDir build/Release `
            -OutputDir arn-windows-x64 `
            -ArchivePath arn-windows-x64.zip `
            -ExpectedVersion ($env:REF_NAME.Substring(1)) `
            -ExpectedCommit $env:GITHUB_SHA

      # Archives exactly arn, LICENSE and README.md, checks the entries, runs
      # the extracted arn with a minimal environment against the tag's version
      # and commit, and lists its shared libraries. A package that fails is deleted.
      - name: Package and verify Unix archive
        if: runner.os != 'Windows'
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: >-
          bash scripts/package-unix.sh package
          --binary build/arn
          --name "${{ matrix.artifact }}"
          --archive "${{ matrix.archive }}"
          --version "${REF_NAME#v}"
          --commit "$GITHUB_SHA"

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  # Only when the policy names windows-ide-x64.
  ide-windows:
    name: Package Windows IDE
    needs: preflight
    if: ${{ !inputs.publish_draft && needs.preflight.outputs.windows_ide == 'true' }}
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ide/package-lock.json
      # stable branch of dtolnay/rust-toolchain at the time of pinning; with a
      # SHA the toolchain must be named, so it is an exact, tested version.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.1
      - name: Install OpenSSL
        shell: pwsh
        run: C:\vcpkg\vcpkg.exe install openssl:x64-windows
      - name: Build C++ backend and tests
        shell: pwsh
        run: |
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="C:\vcpkg\scripts\buildsystems\vcpkg.cmake"
          cmake --build build --config Release --parallel
          ctest --test-dir build -C Release --output-on-failure
      - name: Install frontend dependencies
        working-directory: ide
        run: npm ci
      - name: Test Rust bridge
        shell: pwsh
        run: |
          $env:ARN_TEST_BIN = (Resolve-Path build/Release/arn_server_fixture.exe).Path
          cargo test --locked --manifest-path ide/src-tauri/Cargo.toml
      - name: Build branded Windows installer
        working-directory: ide
        shell: pwsh
        run: |
          $env:ARN_BIN = (Resolve-Path ../build/Release/arn.exe).Path
          $env:ARN_RUNTIME_DIR = 'C:\vcpkg\installed\x64-windows\bin'
          npm run installer:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The installer payload: exact tag version and commit of the bundled
      # arn.exe (no -dirty or unknown), the IDE's version resource, runtime
      # DLLs and third-party notices.
      - name: Test the actual installer payload
        working-directory: ide
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $setup = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*-setup.exe')
          if ($setup.Count -ne 1) { throw 'Expected exactly one Windows installer' }
          7z x $setup[0].FullName '-osrc-tauri/target/installer-smoke' -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:ARN_EXPECTED_VERSION = $env:REF_NAME.Substring(1)
          $env:ARN_EXPECTED_COMMIT = $env:GITHUB_SHA
          node ../tests/installer_runtime_test.mjs src-tauri/target/installer-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ../scripts/verify-ide-package.ps1 -Directory src-tauri/target/installer-smoke `
            -ExpectedVersion $env:ARN_EXPECTED_VERSION -ExpectedCommit $env:GITHUB_SHA
          # The production bundle: Monaco bundled, no CDN code, restrictive CSP.
          $env:ARN_IDE_DIST = 'dist'
          node --test ../tests/ide_security_test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package portable IDE
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $package = "arn-ide-windows-x64"
          New-Item -ItemType Directory -Force $package | Out-Null
          Copy-Item "ide/src-tauri/target/release/arn-ide.exe" "$package/arn-ide.exe"
          $runtime = 'ide/src-tauri/installer/runtime'
          foreach ($file in (Get-Content "$runtime/manifest.json" -Raw | ConvertFrom-Json)) {
            Copy-Item (Join-Path $runtime $file) $package
          }
          Copy-Item "LICENSE", "README.md" $package
          Copy-Item "docs/ide-arn-bridge.md" "$package/IDE-README.md"
          Compress-Archive -Path "$package/*" -DestinationPath "arn-ide-windows-x64.zip"
          ./scripts/verify-ide-package.ps1 -ZipPath arn-ide-windows-x64.zip `
            -ExpectedVersion ($env:REF_NAME.Substring(1)) -ExpectedCommit $env:GITHUB_SHA
          $installers = @(Get-ChildItem 'ide/src-tauri/target/release/bundle/nsis' -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer' }
          Copy-Item $installers[0].FullName 'arn-ide-windows-x64-setup.exe'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-arn-ide-windows-x64
          path: |
            arn-ide-windows-x64.zip
            arn-ide-windows-x64-setup.exe
          if-no-files-found: error

  # Step 1: a draft release with exactly the policy's assets. It runs only when
  # the preflight passed and every package the policy names was built: the
  # Windows IDE job may be skipped only because the policy leaves it out.
  draft:
    name: Create draft release
    needs: [preflight, build, ide-windows]
    if: >-
      ${{ !cancelled() && !inputs.publish_draft && github.ref_type == 'tag' &&
          needs.preflight.result == 'success' && needs.build.result == 'success' &&
          (needs.ide-windows.result == 'success' ||
           (needs.ide-windows.result == 'skipped' && needs.preflight.outputs.windows_ide != 'true')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      EXPECTED: ${{ needs.preflight.outputs.expected }}
      PLATFORMS: ${{ needs.preflight.outputs.platforms }}
      PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # A rerun must not add to or replace a release, published or draft.
      - name: Refuse to touch an existing release
        run: |
          existing="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.tag_name == env.TAG) | "\(.id) draft=\(.draft)"')"
          if [ -n "$existing" ]; then
            echo "::error::A release for $TAG already exists ($existing). It is never replaced or added to; delete the draft by hand to build it again."
            exit 1
          fi

      # One directory per artifact, so two artifacts with the same file name
      # cannot silently overwrite each other; release-checksums.cmake rejects it.
      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: artifacts

      # Exactly the policy's assets, each listed once in SHA256SUMS; anything
      # else (a Windows package the policy leaves out included) fails here.
      - name: Collect assets and write SHA256SUMS
        run: cmake -DARTIFACTS_DIR=artifacts -DDIST_DIR=dist "-DEXPECTED=$EXPECTED" -P scripts/release-checksums.cmake

      # Defence in depth for the policy's Windows exclusion.
      - name: Check that no left-out Windows package is present
        run: |
          case ",$PLATFORMS," in *,windows-x64,*) cli=1 ;; *) cli=0 ;; esac
          case ",$PLATFORMS," in *,windows-ide-x64,*) ide=1 ;; *) ide=0 ;; esac
          for file in dist/*; do
            name="${file##*/}"
            case "$name" in
              arn-ide-windows-*) [ "$ide" = 1 ] || { echo "::error::$name is not in this release's policy."; exit 1; } ;;
              *windows*) [ "$cli" = 1 ] || { echo "::error::$name is not in this release's policy."; exit 1; } ;;
            esac
          done

      # An independent implementation must agree with every manifest line.
      - name: Check SHA256SUMS with sha256sum
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS

      - name: Create draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          prerelease: ${{ needs.preflight.outputs.prerelease }}
          make_latest: ${{ needs.preflight.outputs.make_latest }}
          overwrite_files: false
          fail_on_unmatched_files: true
          body_path: docs/releases/${{ github.ref_name }}.md
          generate_release_notes: true
          files: dist/*

      - name: Check the draft
        run: |
          releases="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.tag_name == env.TAG)' | jq -s .)"
          [ "$(echo "$releases" | jq length)" = 1 ] || { echo "::error::Expected exactly one release for $TAG."; exit 1; }
          [ "$(echo "$releases" | jq '.[0].draft')" = true ] || { echo "::error::The release for $TAG is not a draft."; exit 1; }
          [ "$(echo "$releases" | jq '.[0].prerelease')" = "$PRERELEASE" ] || { echo "::error::The draft's prerelease flag is not $PRERELEASE."; exit 1; }
          actual="$(echo "$releases" | jq -r '.[0].assets[].name' | LC_ALL=C sort)"
          wanted="$( { echo "$EXPECTED" | tr ';' '\n'; echo SHA256SUMS; } | LC_ALL=C sort)"
          if [ "$actual" != "$wanted" ]; then
            echo "::error::The draft's assets differ from the policy."
            diff <(echo "$wanted") <(echo "$actual") || true
            exit 1
          fi
          echo "Draft release for $TAG is ready: prerelease=$PRERELEASE, assets: $(echo $actual)."
          echo "Publish it with: Run workflow on $TAG, publish_draft checked."

  # Step 2, started by hand on the tag with publish_draft checked: checks the
  # draft once more, publishes it as the policy says, and checks the result.
  publish:
    name: Publish the draft release
    needs: preflight
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_draft && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      EXPECTED: ${{ needs.preflight.outputs.expected }}
      PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
      MAKE_LATEST: ${{ needs.preflight.outputs.make_latest }}
    steps:
      - name: Check the draft and its assets
        run: |
          releases="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.tag_name == env.TAG)' | jq -s .)"
          [ "$(echo "$releases" | jq length)" = 1 ] || { echo "::error::Expected exactly one release for $TAG."; exit 1; }
          [ "$(echo "$releases" | jq '.[0].draft')" = true ] || { echo "::error::The release for $TAG is not a draft; nothing to publish."; exit 1; }
          [ "$(echo "$releases" | jq '.[0].prerelease')" = "$PRERELEASE" ] || { echo "::error::The draft's prerelease flag is not $PRERELEASE."; exit 1; }
          actual="$(echo "$releases" | jq -r '.[0].assets[].name' | LC_ALL=C sort)"
          wanted="$( { echo "$EXPECTED" | tr ';' '\n'; echo SHA256SUMS; } | LC_ALL=C sort)"
          [ "$actual" = "$wanted" ] || { echo "::error::The draft's assets differ from the policy."; diff <(echo "$wanted") <(echo "$actual") || true; exit 1; }
          mkdir draft
          gh release download "$TAG" --dir draft
          cd draft
          listed="$(awk '{ print $2 }' SHA256SUMS | LC_ALL=C sort)"
          [ "$listed" = "$(echo "$EXPECTED" | tr ';' '\n' | LC_ALL=C sort)" ] || { echo "::error::SHA256SUMS does not list exactly the policy's assets."; exit 1; }
          sha256sum --check --strict SHA256SUMS

      - name: Publish
        run: gh release edit "$TAG" --draft=false "--prerelease=$PRERELEASE" "--latest=$MAKE_LATEST"

      # After publication: marked as the policy says, and a prerelease is not
      # the latest release.
      - name: Check the published release
        run: |
          release="$(gh api "repos/$GH_REPO/releases/tags/$TAG")"
          [ "$(echo "$release" | jq '.draft')" = false ] || { echo "::error::$TAG is still a draft."; exit 1; }
          [ "$(echo "$release" | jq '.prerelease')" = "$PRERELEASE" ] || { echo "::error::$TAG prerelease flag is not $PRERELEASE."; exit 1; }
          latest="$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name || echo none)"
          if [ "$MAKE_LATEST" = false ] && [ "$latest" = "$TAG" ]; then
            echo "::error::$TAG became the latest release, but its policy says it must not."
            exit 1
          fi
          if [ "$MAKE_LATEST" = true ] && [ "$latest" != "$TAG" ]; then
            echo "::error::$TAG should be the latest release, but the latest is $latest."
            exit 1
          fi
          echo "$TAG published: prerelease=$PRERELEASE; the latest release is $latest."
